// ============ 香港公眾假期（同 firmware holiday.cpp 一致，只有日號）============
const HK_HOLIDAY_DAYS = {

  2027: {1:[1],2:[6,8,9],3:[26,27,29],4:[5],5:[1,13],6:[9],7:[1],9:[16],10:[1,8],12:[25,27]}
};
// 假期名（同 firmware getHolidayName）
const HK_HOLIDAY_NAMES = {
  "2026-1-1":"元旦","2026-2-17":"年初一","2026-2-18":"年初二","2026-2-19":"年初三",
  "2026-4-3":"受難節","2026-4-4":"受難翌日","2026-4-6":"清明翌日","2026-4-7":"復活翌日",

  "2027-1-1":"元旦","2027-2-6":"年初一","2027-2-8":"年初三","2027-2-9":"年初四",
  "2027-3-26":"受難節","2027-3-27":"受難翌日","2027-3-29":"復活節","2027-4-5":"清明節",
  "2027-5-1":"勞動節","2027-5-13":"佛誕","2027-6-9":"端午節","2027-7-1":"特區紀念",
  "2027-9-16":"中秋翌日","2027-10-1":"國慶日","2027-10-8":"重陽節",
  "2027-12-25":"聖誕節","2027-12-27":"聖誕翌日"
};

// ============ 農曆計算（port 自 nl_month_days）============
function nlMonthDays(year, month) {
  const result = new Array(31).fill(0);
  const daysofmonth = [31,28,31,30,31,30,31,31,30,31,30,31];
  if (year % 4 === 0 && year % 100 !== 0) daysofmonth[1] = 29;
  const lunarInfo = LUNAR_CAL_DIC[year - 1901];
  const newYearDay = lunarInfo & 0x1F;
  const newYearMonth = (lunarInfo >> 5) & 0x03;
  const leapMonth = (lunarInfo >> 20) & 0x0F;
  if (newYearMonth > month) {
    const daysCount = newYearDay - 1 + daysofmonth[0];
    const lastInfo = LUNAR_CAL_DIC[year - 2];
    const lastLeap = (lastInfo >> 20) & 0x0F;
    const L12 = (lastInfo >> (7 + (lastLeap > 0 ? 0 : 1))) & 0x1;
    const L11 = (lastInfo >> (8 + (lastLeap > 0 ? 0 : 1))) & 0x1;
    const begin = 29 + L12 + 29 + L11 - daysCount + 1;
    for (let i = 0; i < daysofmonth[0]; i++) {
      result[i] = (begin + i <= 29 + L11) ? (1100 + begin + i) : (1200 + i + begin - 29 - L11);
    }
  } else if (newYearMonth === month) {
    const lastInfo = LUNAR_CAL_DIC[year - 2];
    const lastLeap = (lastInfo >> 20) & 0x0F;
    const isLastLarge = (lastInfo >> (7 + (lastLeap > 0 ? 0 : 1))) & 0x1;
    const lastLunarDayInMonth = 29 + isLastLarge;
    for (let i = 0; i <= daysofmonth[newYearMonth-1] - newYearDay; i++) {
      result[newYearDay + i - 1] = 100 + i + 1;
    }
    for (let i = 0; i < newYearDay - 1; i++) {
      result[i] = 1200 + lastLunarDayInMonth - newYearDay + 2 + i;
    }
  } else {
    let daysCount = -newYearDay + 1;
    for (let i = newYearMonth; i < month; i++) daysCount += daysofmonth[i-1];
    let lunarMonth = 0, isLargeMonth = 0, lunarDayInMonth = 0;
    while (1) {
      isLargeMonth = (lunarInfo >> (19 - lunarMonth)) & 0x1;
      lunarDayInMonth = 29 + isLargeMonth;
      if (daysCount >= lunarDayInMonth) { daysCount -= lunarDayInMonth; lunarMonth++; }
      else break;
    }
    for (let i = 0; i < daysofmonth[month-1]; i++) {
      if (daysCount >= lunarDayInMonth) { daysCount -= lunarDayInMonth; lunarMonth++; }
      if (leapMonth === 0 || leapMonth >= lunarMonth + 1) result[i] = (lunarMonth + 1) * 100 + daysCount + 1;
      else if (leapMonth === lunarMonth) result[i] = lunarMonth * -100 + daysCount + 1;
      else result[i] = lunarMonth * 100 + daysCount + 1;
      daysCount++;
    }
  }
  return result;
}

// 農曆日期 → 文字（同 firmware 邏輯）
function lunarDayText(ld, isLeap) {
  const mon = Math.floor(ld / 100), day = ld % 100;
  let s;
  if (day === 10) s = "初十";
  else if (day === 20) s = "二十";
  else if (day === 30) s = "三十";
  else s = NL10[Math.floor(day/10)] + NL_D[day % 10];
  return (isLeap ? "閏" : "") + NL_MON[mon] + "月" + s;
}

// 天干地支生肖（同 firmware：nl_tg=year%10, nl_dz=year%12，考慮春節前）
function lunarYearText(year, lunarMon, solarMon) {
  const adj = lunarMon > solarMon ? 1 : 0;
  const y = year - adj;
  return TG[y % 10] + DZ[y % 12] + "年 " + SX[y % 12];
}

"use strict";
// ============ 狀態 ============
let FAM = { children: [], events: [], reminders: [], holidays: [] };
let viewYear = 2026, viewMonth = 9;
const nowD = new Date();
const TODAY = { y: nowD.getFullYear(), m: nowD.getMonth() + 1, d: nowD.getDate() };

// ============ 工具 ============
const $ = id => document.getElementById(id);
function pad2(n) { return String(n).padStart(2, "0"); }
function totalDaysOf(y, m) { return new Date(y, m, 0).getDate(); }
function isHKHoliday(y, m, d) {
  const tbl = HK_HOLIDAY_DAYS[y];
  return !!(tbl && tbl[m] && tbl[m].includes(d));
}
function holidayName(y, m, d) { return HK_HOLIDAY_NAMES[y + "-" + m + "-" + d] || null; }

// gist 假期/提醒（可補充 firmware 硬編碼以外嘅日子）
function gistHolidayName(y, m, d) {
  const mmdd = pad2(m) + pad2(d);
  for (const h of (FAM.holidays || [])) if (h.mmdd === mmdd && h.name) return h.name;
  return null;
}
function gistReminder(y, m, d) {
  const mmdd = pad2(m) + pad2(d);
  for (const r of (FAM.reminders || [])) if (r.mmdd === mmdd && r.text) return "⏰" + r.text;
  return null;
}

// 該日家庭活動（weekday 恆常 + mmdd 一次性/範圍），照 firmware 順序（唔重排）
function eventsFor(y, m, d) {
  const weekday = new Date(y, m - 1, d).getDay(); // 0=日
  const fw = weekday === 0 ? 7 : weekday;         // firmware: 1=一 … 7=日
  const mmdd = pad2(m) + pad2(d);
  const out = [];
  for (const c of (FAM.children || [])) {
    for (const s of (c.schedule || [])) {
      if (Number(s.weekday) === fw && s.text) out.push(String(s.text));
    }
  }
  for (const e of (FAM.events || [])) {
    if (!e.mmdd || !e.text) continue;
    const end = e.mmdd_end || e.mmdd;
    if (e.mmdd <= mmdd && mmdd <= end) out.push(String(e.text));
  }
  return out;
}

// ============ 繪畫 ============
function render() {
  const epd = $("epd");
  // 清走動態元素
  epd.querySelectorAll(".daycell,.todaybox,.todaybox2,.hcell").forEach(el => el.remove());

  $("ymLabel").textContent = viewYear + "年" + viewMonth + "月";
  // 頂欄日期（示範用：以 15 號為例；今日框另有模擬）
  const demoDay = (viewYear === TODAY.y && viewMonth === TODAY.m) ? TODAY.d : 15;
  const ld = nlMonthDays(viewYear, viewMonth)[demoDay - 1];
  const isLeap = ld < 0, lav = Math.abs(ld);
  const lmon = Math.floor(lav / 100), lday = lav % 100;
  $("topdate").innerHTML = viewYear + '<span class="cjk">年</span>' + viewMonth +
    '<span class="cjk">月</span>' + demoDay + '<span class="cjk">日</span>';
  $("toplunar1").textContent = lunarYearText(viewYear, lmon, viewMonth);
  $("toplunar2").textContent = "農曆" + lunarDayText(lav, isLeap);

  // 星期 header（星期日開始，_week_1st=0）
  for (let i = 0; i < 7; i++) {
    const cell = document.createElement("div");
    cell.className = "hcell";
    cell.style.left = (i * DAY_W) + "px";
    cell.style.background = (i === 0) ? RED : BLACK;
    cell.textContent = WEEK[i];
    $("calheader").appendChild(cell);
  }

  // 日期格
  const total = totalDaysOf(viewYear, viewMonth);
  const wday1 = new Date(viewYear, viewMonth - 1, 1).getDay();
  const rows = Math.max(5, Math.ceil((wday1 + total) / 7));
  const dayH = Math.floor(424 / rows);
  const lunarArr = nlMonthDays(viewYear, viewMonth);

  for (let d = 1; d <= total; d++) {
    const num = wday1 + d - 1;
    const col = num % 7, row = Math.floor(num / 7);
    const x = col * DAY_W, y = row * dayH;
    const isSunday = (new Date(viewYear, viewMonth - 1, d).getDay() === 0);
    let color = isSunday ? RED : BLACK;
    if (isHKHoliday(viewYear, viewMonth, d)) color = RED;

    const cell = document.createElement("div");
    cell.className = "daycell";
    cell.style.left = x + "px"; cell.style.top = y + "px"; cell.style.height = dayH + "px";
    cell.style.color = color;

    let html = '<span class="daynum" style="color:' + color + ';">' + d + "</span>";
    const hn = holidayName(viewYear, viewMonth, d) || gistHolidayName(viewYear, viewMonth, d);
    if (hn) html += '<span class="holidayname">' + hn + "</span>";
    const rem = gistReminder(viewYear, viewMonth, d);
    if (rem) html += '<span class="holidayname" style="left:auto;right:4px;color:#111;">' + rem + "</span>";

    // 家庭活動（由格仔底向上排，同 firmware 一致；firmware baseline=y+dayH-8 → CSS top=y+dayH-20）
    const evs = eventsFor(viewYear, viewMonth, d);
    const maxL = Math.min(evs.length, Math.floor((dayH - 24) / 12) || 1, 5);
    for (let i = 0; i < maxL; i++) {
      const lines = String(evs[i]).split("\n");
      const lineTop = dayH - 20 - i * 12;
      html += '<span class="evline" style="top:' + lineTop + 'px;">' +
        lines[0].replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
      // 同一 event 內 \n 續行
      for (let k = 1; k < lines.length && (i + k) < maxL; k++) {
        html += '<span class="evline" style="top:' + (lineTop - k * 12) + 'px;">' +
          lines[k].replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
      }
    }
    cell.innerHTML = html;
    $("days").appendChild(cell);

    // 今日框（雙線，同 firmware drawRoundRect x2；#days 頂部有 56px header所以要加返 offset）
    const showToday = $("todaySim").checked
      ? d === Number($("todayDay").value)
      : (viewYear === TODAY.y && viewMonth === TODAY.m && d === TODAY.d);
    if (showToday) {
      const absX = x, absY = DAYS_TOP + y;
      const b1 = document.createElement("div");
      b1.className = "todaybox";
      b1.style.cssText = "left:" + absX + "px;top:" + (absY + 1) + "px;width:" + DAY_W + "px;height:" + (dayH - 1) + "px;";
      const b2 = document.createElement("div");
      b2.className = "todaybox2";
      b2.style.cssText = "left:" + (absX + 1) + "px;top:" + (absY + 2) + "px;width:" + (DAY_W - 2) + "px;height:" + (dayH - 3) + "px;";
      epd.appendChild(b1); epd.appendChild(b2);
    }
  }

  // 月份下拉同步
  const sel = $("monthSel");
  if (sel.options.length === 0) {
    for (let yy = 2026; yy <= 2027; yy++) for (let mm = 1; mm <= 12; mm++) {
      const opt = document.createElement("option");
      opt.value = yy + "-" + mm; opt.textContent = yy + "年" + mm + "月";
      sel.appendChild(opt);
    }
  }
  sel.value = viewYear + "-" + viewMonth;
}

// ============ Gist 載入 ============
async function loadGist() {
  const st = $("gistStatus");
  st.textContent = "連接 Gist…"; st.className = "";
  try {
    const r = await fetch(GIST_URL, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    FAM = await r.json();
    const nSched = (FAM.children || []).reduce((a, c) => a + (c.schedule || []).length, 0);
    st.textContent = "✓ Gist 已載入（events " + (FAM.events || []).length + "・schedule " + nSched + "・updated " + (FAM.updated || "?") + "）";
  } catch (e) {
    st.textContent = "✗ Gist 載入失敗（" + e.message + "）— 用空白日程顯示";
    st.className = "err";
    FAM = { children: [], events: [], reminders: [], holidays: [] };
  }
  render();
}

// ============ 工具列事件 ============
$("prevBtn").onclick = () => { viewMonth--; if (viewMonth < 1) { viewMonth = 12; viewYear--; } render(); };
$("nextBtn").onclick = () => { viewMonth++; if (viewMonth > 12) { viewMonth = 1; viewYear++; } render(); };
$("todayBtn").onclick = () => { viewYear = TODAY.y; viewMonth = TODAY.m; render(); };
$("monthSel").onchange = e => { const p = e.target.value.split("-"); viewYear = +p[0]; viewMonth = +p[1]; render(); };
$("todaySim").onchange = () => { $("todayDay").disabled = !$("todaySim").checked; render(); };
$("todayDay").oninput = render;
$("reloadBtn").onclick = loadGist;

// init
viewYear = TODAY.y; viewMonth = TODAY.m;
loadGist();
setInterval(loadGist, 5 * 60 * 1000); // 每 5 分鐘自動重載
</script>

</body>
</html>
